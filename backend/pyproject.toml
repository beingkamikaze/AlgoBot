[project]
name = "tradingbot-backend"
version = "0.1.0"
description = "TradingBot backend: market data, strategies, risk, paper trading, AI analyst"
requires-python = ">=3.12"
dependencies = [
    "kiteconnect>=5.2",
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=2",
    "tzdata>=2024.1",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
